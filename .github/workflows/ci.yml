name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  verify:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      # Unit tests resolve @kala-ui/react-hooks and @kala-ui/react from
      # their built dist output, so build both before testing.
      - run: pnpm --filter @kala-ui/react-hooks --filter @kala-ui/react build
      - run: pnpm run test

  build:
    name: Package & Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build-storybook

  consumer:
    name: Next.js App Router consumer build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The playground imports the built package output, exactly like an
      # external consumer — build packages first.
      - run: pnpm run build
      - run: pnpm run build:apps

  storybook:
    name: Storybook smoke & visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The composed Storybook aliases @kala-ui/react to source, but app
      # stories resolve @kala-ui/react-hooks from its built dist output.
      - run: pnpm --filter @kala-ui/react-hooks build
      - run: pnpm --filter @kala-ui/react exec playwright install --with-deps chromium
      - run: pnpm run test-storybook
      - name: Archive visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: packages/react/storybook-static
          retention-days: 7
