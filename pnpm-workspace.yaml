packages:
  - 'packages/*'
  - 'apps/*'

# Expo SDK 57 pins react-native-worklets 0.10.1 in bundledNativeModules;
# expo-modules-core/reanimated peer metadata asks 0.12.x. Force the single
# SDK-tested version so a second worklets instance cannot split the module registry.
overrides:
  react-native-worklets: 0.10.1

# Peer-range registry-lag fixes (warning filters, not install pins): each
# entry silences an unmet-peer WARNING where published metadata trails the
# versions this repo pins.
peerDependencyRules:
  allowedVersions:
    # Flat 'parent>peer' selector keys are the documented shape. Object-valued
    # entries crash pnpm's selector parser (bareSpecifier.startsWith on a
    # non-string), so never nest a map under a package name here.
    'jest-watch-typeahead>jest': '30'
    'expo-modules-core>react-native-worklets': '0'
    'react-native-reanimated>react-native-worklets': '0'
    'react-dom>react': '19'

# Single source of truth for dependency versions shared across workspace
# packages — reference as "catalog:" from any package.json. Every entry is an
# EXACT pin (no ^/~): this repo develops and tests against locked versions,
# and "latest" is a deliberate bump, never a surprise resolution.
# Consumer-facing peerDependencies stay literal ranges (^19.2.0) on purpose:
# the catalog pins what we develop against, peers declare what consumers may
# install. The one exception below: react/react-dom in the native playground.
catalog:
  # React + types (web; the native playground pins react 19.2.3 inline —
  # Expo SDK 57's tested matrix — and cannot use these entries)
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # Toolchain
  typescript: 7.0.2
  vite: 8.3.0
  '@vitejs/plugin-react': 6.1.1
  '@types/node': 26.5.1
  postcss: 8.5.28
  # Test stack
  vitest: 5.0.0
  '@vitest/coverage-v8': 5.0.0
  jsdom: 30.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/user-event': 14.6.7
  vitest-axe: 0.1.0
  # Tailwind
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  tailwindcss-animate: 1.0.7
  # Shared runtime dependencies
  lucide-react: 1.46.0
  simple-icons: 16.31.0
  # Expo / React Native (SDK 57 matrix) — EXACT pins, no ranges. Each is the
  # latest release inside expo@57.0.22 bundledNativeModules.json; going newer
  # (react-native 0.87.x, react 19.3, reanimated 4.6.0) is outside the SDK's
  # tested matrix and is deliberately not taken. Verified by
  # packages/react-native/scripts/check-sdk-compat.mjs.
  # react / react-dom stay inline in apps/native-playground (SDK pins 19.2.3;
  # the catalog's web react is 19.3.0 and a split react/react-dom pair inside
  # one app breaks the bundle — catalog is one version per name).
  expo: 57.0.22
  react-native: 0.86.3
  react-native-reanimated: 4.5.1
  react-native-gesture-handler: 2.32.0
  react-native-screens: 4.26.2
  react-native-safe-area-context: 5.7.0
  react-native-svg: 15.15.4
  react-native-unistyles: 3.3.0
  react-native-nitro-modules: 0.37.1
  react-native-edge-to-edge: 1.8.1
  '@react-native/normalize-colors': 0.87.1
  react-native-web: 0.21.2
  '@expo/metro-runtime': 57.0.15
  babel-preset-expo: 57.0.11
  jest-expo: 57.0.5
  '@react-native/metro-config': 0.86.3
  '@react-native/jest-preset': 0.86.3
  # Native component layer (not SDK-managed — peers cover compatibility)
  lucide-react-native: 1.46.0
  '@testing-library/react-native': 14.0.1
  '@types/jest': 30.0.0
